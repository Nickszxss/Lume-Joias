# ==========================================
# CONEXÃO COM O POSTGRESQL DO SUPABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://db.pssrggtqmphcpqbdhjex.supabase.co:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:98794031@Rob}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Cria/atualiza as tabelas de acordo com as entidades
spring.jpa.hibernate.ddl-auto=update

# Dialeto PostgreSQL para evitar falha se o metadata JDBC não puder ser lido
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostra os comandos SQL no console
spring.jpa.show-sql=true

# Formata os comandos SQL no console
spring.jpa.properties.hibernate.format_sql=true

# Evita problemas de sessão aberta durante a resposta
spring.jpa.open-in-view=false
