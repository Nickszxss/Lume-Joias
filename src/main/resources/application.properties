spring.application.name=projeto-joias

# ==========================================
# CONFIGURAÇÃO SUPABASE REST API
# ==========================================

supabase.url=${SUPABASE_URL:https://pssrggtqmphcpqbdhjex.supabase.co/rest/v1}
supabase.key=${SUPABASE_PUBLISHABLE_KEY:sb_publishable_p9yLQDR5lj0uT0F5NQ1_aw_6TyS9job}

# ==========================================
# CONEXÃO COM O BANCO DE DADOS (H2 / SUPABASE)
# ==========================================

spring.datasource.url=${DB_URL:jdbc:h2:mem:projeto_joias;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Cria/atualiza as tabelas de acordo com as entidades
spring.jpa.hibernate.ddl-auto=update


# Mostra os comandos SQL no console
spring.jpa.show-sql=true

# Formata os comandos SQL no console
spring.jpa.properties.hibernate.format_sql=true

# Evita problemas de sessão aberta durante a resposta
spring.jpa.open-in-view=false
