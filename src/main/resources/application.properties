spring.application.name=projeto-joias

# ==========================================
# CONEXÃO COM O POSTGRESQL DO SUPABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projeto_joias}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Cria/atualiza as tabelas de acordo com as entidades
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no console
spring.jpa.show-sql=true

# Formata os comandos SQL no console
spring.jpa.properties.hibernate.format_sql=true

# Evita problemas de sessão aberta durante a resposta
spring.jpa.open-in-view=false
