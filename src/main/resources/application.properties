spring.application.name=projeto-joias

# ==========================================
# CONEXÃO COM O POSTGRESQL DO SUPABASE
# ==========================================
# Para conectar ao Supabase PostgreSQL, forneça as seguintes variáveis de ambiente:
# - SUPABASE_DB_URL (ou DB_URL): URL de conexão PostgreSQL
# - SUPABASE_DB_USER (ou DB_USERNAME): Usuário do banco
# - SUPABASE_DB_PASSWORD (ou DB_PASSWORD): Senha do banco

spring.datasource.url=${SUPABASE_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${SUPABASE_DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
